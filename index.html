<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DITEC 360° | Governança BRB</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brb-navy: #0e2a5c;       /* Azul Escuro da Identidade Estratégica */
            --brb-blue: #0070d2;       /* Azul Corporativo Vibrante */
            --brb-light: #f4f7fa;      /* Fundo suave para contraste profissional */
            --white: #ffffff;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--brb-light);
            margin: 0;
            padding: 40px 20px;
        }

        .ditec-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Cabeçalho Robusto --- */
        .header-branding {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0e6ed;
            padding-bottom: 30px;
        }

        .brb-logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--brb-navy);
            letter-spacing: -2px;
        }

        .ditec-symbol {
            width: 70px;
            height: 70px;
            animation: spin 40s linear infinite; /* Rotação suave para inovação */
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .header-banner {
            background: linear-gradient(90deg, var(--brb-navy) 0%, var(--brb-blue) 100%);
            color: var(--white);
            padding: 15px 35px;
            border-radius: 8px 40px 40px 8px; /* Design idêntico à Identidade Estratégica */
            box-shadow: 0 4px 12px rgba(14, 42, 92, 0.2);
        }

        .header-banner h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- Grid de Menu --- */
        .brb-menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        /* --- Cards Estilo BRB --- */
        .brb-card {
            background-color: var(--brb-navy);
            border-radius: 24px; /* Curvatura robusta conforme imagem */
            min-height: 180px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        .brb-card:hover {
            transform: translateY(-10px);
            background-color: var(--brb-blue);
            box-shadow: 0 20px 40px rgba(0, 112, 210, 0.3);
        }

        .brb-card-visible {
            padding: 40px 20px;
            text-align: center;
            color: var(--white);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-main-icon { font-size: 3rem; margin-bottom: 15px; opacity: 0.9; }

        .brb-card h2 { margin: 0; font-size: 1.4rem; font-weight: 700; }

        /* --- Menu Expansível --- */
        .brb-card-hidden {
            max-height: 0;
            background: rgba(0,0,0,0.1);
            transition: max-height 0.4s ease;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        .brb-card:hover .brb-card-hidden {
            max-height: 500px;
            padding: 20px;
        }

        .brb-card-hidden a {
            color: var(--white);
            text-decoration: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .brb-card-hidden a:hover { background: var(--white); color: var(--brb-navy); }

        /* Responsividade */
        @media (max-width: 1024px) { .brb-menu-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .brb-menu-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="ditec-container">
    <header class="header-branding">
        <div class="brb-logo">BRB</div>
        <img src="image_e64b4e.png" alt="Símbolo DITEC" class="ditec-symbol">
        <div class="header-banner">
            <h1>DITEC 360° <span>|</span> Identidade Estratégica</h1>
        </div>
    </header>

    <div class="brb-menu-grid">
        <!-- Estratégia -->
        <div class="brb-card">
            <div class="brb-card-visible">
                <i class="fa-solid fa-bullseye card-main-icon"></i>
                <h2>Estratégia</h2>
            </div>
            <div class="brb-card-hidden">
                <a href="#"><i class="fa-solid fa-map"></i> PETI</a>
                <a href="#"><i class="fa-solid fa-sitemap"></i> PDTI</a>
                <a href="#"><i class="fa-solid fa-graduation-cap"></i> Capacitação</a>
            </div>
        </div>

        <!-- Operação -->
        <div class="brb-card">
            <div class="brb-card-visible">
                <i class="fa-solid fa-users-gear card-main-icon"></i>
                <h2>Operação</h2>
            </div>
            <div class="brb-card-hidden">
                <a href="#"><i class="fa-solid fa-handshake"></i> ANS</a>
                <a href="#"><i class="fa-solid fa-chart-line"></i> Métricas</a>
                <a href="#"><i class="fa-solid fa-diagram-project"></i> Processos</a>
            </div>
        </div>

        <!-- Financeiro -->
        <div class="brb-card">
            <div class="brb-card-visible">
                <i class="fa-solid fa-coins card-main-icon"></i>
                <h2>Financeiro</h2>
            </div>
            <div class="brb-card-hidden">
                <a href="#"><i class="fa-solid fa-file-invoice-dollar"></i> Orçamento</a>
                <a href="#"><i class="fa-solid fa-vault"></i> Custo de Sistemas</a>
                <a href="#"><i class="fa-solid fa-file-signature"></i> Contratos</a>
            </div>
        </div>

        <!-- Controle -->
        <div class="brb-card">
            <div class="brb-card-visible">
                <i class="fa-solid fa-list-check card-main-icon"></i>
                <h2>Controle</h2>
            </div>
            <div class="brb-card-hidden">
                <a href="#"><i class="fa-solid fa-tasks"></i> Planos de Ação</a>
                <a href="#"><i class="fa-solid fa-file-shield"></i> Pendências</a>
                <a href="#"><i class="fa-solid fa-clipboard-check"></i> Conformidade</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
