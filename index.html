<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DITEC 360° | Governança BRB</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* O CSS permanece o mesmo da versão anterior para manter a robustez */
    </style>
</head>
<body>

<div class="ditec-container">
    <header class="ditec-header">
        <div class="header-branding">
            <div class="brb-logo">BRB</div>
            <img src="image_e64b4e.png" alt="Símbolo DITEC" class="ditec-symbol">
            <div class="header-banner">
                <h1>DITEC 360° <span>|</span> GOVERNANÇA</h1>
            </div>
        </div>
    </header>

    <div class="brb-menu-grid">
        
        <!-- Pilar Estratégia: Ícone de Alvo -->
        <div class="brb-card">
            <div class="brb-card-visible">
                <i class="fa-solid fa-bullseye card-main-icon"></i>
                <h2>Estratégia</h2>
            </div>
            <div class="brb-card-hidden">
                <a href="#"><i class="fa-solid fa-map"></i> PETI</a>
                <a href="#"><i class="fa-solid fa-sitemap"></i> PDTI</a>
                <a href="#"><i class="fa-solid fa-graduation-cap"></i> Capacitação</a>
            </div>
        </div>

        <!-- Pilar Operação: Ícone de Usuários -->
        <div class="brb-card">
            <div class="brb-card-visible">
                <i class="fa-solid fa-users-gear card-main-icon"></i>
                <h2>Operação</h2>
            </div>
            <div class="brb-card-hidden">
                <a href="#"><i class="fa-solid fa-handshake"></i> ANS</a>
                <a href="#"><i class="fa-solid fa-chart-line"></i> Métricas</a>
                <a href="#"><i class="fa-solid fa-diagram-project"></i> Processos</a>
                <a href="#"><i class="fa-solid fa-rocket"></i> Implantações</a>
            </div>
        </div>

        <!-- Pilar Financeiro: Ícone de Moedas -->
        <div class="brb-card">
            <div class="brb-card-visible">
                <i class="fa-solid fa-coins card-main-icon"></i>
                <h2>Financeiro</h2>
            </div>
            <div class="brb-card-hidden">
                <a href="#"><i class="fa-solid fa-file-invoice-dollar"></i> Orçamento</a>
                <a href="#"><i class="fa-solid fa-vault"></i> Custo de Sistemas</a>
                <a href="#"><i class="fa-solid fa-file-signature"></i> Contratos</a>
                <a href="#"><i class="fa-solid fa-clock"></i> Horas Extras</a>
            </div>
        </div>

        <!-- Pilar Controle: Ícone de Processos/Checklist -->
        <div class="brb-card">
            <div class="brb-card-visible">
                <i class="fa-solid fa-list-check card-main-icon"></i>
                <h2>Controle</h2>
            </div>
            <div class="brb-card-hidden">
                <a href="#"><i class="fa-solid fa-list-ol"></i> Planos de Ação</a>
                <a href="#"><i class="fa-solid fa-file-shield"></i> Pendências Contábeis</a>
                <a href="#"><i class="fa-solid fa-clipboard-check"></i> Conformidade</a>
                <a href="#"><i class="fa-regular fa-newspaper"></i> Boletim DITEC</a>
            </div>
        </div>

    </div>
</div>

</body>
</html>
